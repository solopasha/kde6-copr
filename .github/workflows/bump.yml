name: Bump revisions

on:
  workflow_dispatch:
  schedule:
    - cron: '0 15 * * *'

jobs:
  main:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    container:
      image: 'registry.fedoraproject.org/fedora-minimal:latest'

    steps:
      - name: Prepare
        run: |
          curl -Ss -L https://copr.fedorainfracloud.org/coprs/solopasha/playground/repo/fedora-42/solopasha-playground-fedora-42.repo > /etc/yum.repos.d/playground.repo
          curl -Ss -L https://copr.fedorainfracloud.org/coprs/solopasha/plasma-unstable/repo/fedora-42/solopasha-plasma-unstable-fedora-42.repo > /etc/yum.repos.d/plasma-unstable.repo
          dnf -y install --nodocs --setopt=install_weak_deps=0 \
            git-core rpm-build curl perl-interpreter jq parallel luajit gh fd-find kf6-srpm-macros

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.WORKFLOW_TOKEN }}

      - name: Branch
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          branch="update-$(tr -dc a-z0-9 </dev/urandom | head -c 8)"
          echo "branch=${branch}" >> $GITHUB_ENV
          git checkout -b "${branch}"

      - name: Bump revisions
        run: |
          bash bumpall.sh -g -b -f

      - name: Commit and push
        env:
          GITHUB_TOKEN: ${{ secrets.WORKFLOW_TOKEN }}
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.spec' || exit 0
          git commit -m "bump revisions" || exit 0
          git push origin "${branch}"
          gh pr create --base unstable \
            --head "${branch}" --title "Bump revisions" \
            --body "This is an autogenerated PR"
