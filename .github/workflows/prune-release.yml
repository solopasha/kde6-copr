name: Prune old released results

on:
  workflow_run:
    workflows: ["Create repo"]
    types:
      - completed
    branches: [unstable]
jobs:
  prune:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: write
    concurrency:
      group: release-prune
      cancel-in-progress: true
    steps:
      - name: Prune
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.event.repository.name }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          BRANCH: unstable
        run: |
          bash prune-release.sh
