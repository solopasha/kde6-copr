name: Gear package list

on:
  workflow_call:
    secrets:
      gpgkey:
        required: true
      copr_webhook_gear:
        required: true
      copr_webhook_beta:
        required: true
    inputs:
      specfiles:
        required: false
        type: string
      abidiff:
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  changed-files:
    name: Assemble builds
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      modified_files: ${{ steps.changed-files.outputs.all_changed_files }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Get changed specs
        id: changed-files
        uses: tj-actions/changed-files@ed68ef82c095e0d48ec87eccea555d944a631a4c
        with:
          files: |
            **/*.spec

  accessibility-inspector:
    if: >-
      ${{
        ! failure() &&
        ! cancelled() &&
        (
          contains(needs.changed-files.outputs.modified_files, '/accessibility-inspector.spec') ||
          contains(inputs.specfiles, '/accessibility-inspector.spec')
        )
      }}
    uses: ./.github/workflows/reusable-build-rpm.yml
    needs:
      - changed-files
    secrets:
      gpgkey: ${{ secrets.gpgkey }}
      copr_webhook_gear: ${{ secrets.copr_webhook_gear }}
      copr_webhook_beta: ${{ secrets.copr_webhook_beta }}
    with:
      spec: ./apps/accessibility-inspector/accessibility-inspector.spec
      deps: ${{ toJson(needs) }}
      abidiff: ${{ inputs.abidiff }}

  akonadi-calendar:
    if: >-
      ${{
        ! failure() &&
        ! cancelled() &&
        (
          contains(needs.changed-files.outputs.modified_files, '/akonadi-calendar.spec') ||
          contains(inputs.specfiles, '/akonadi-calendar.spec')
        )
      }}
    uses: ./.github/workflows/reusable-build-rpm.yml
    needs:
      - akonadi-contacts
      - akonadi-mime
      - akonadi-server
      - changed-files
      - kcalutils
      - kidentitymanagement
      - kmailtransport
      - kmime
      - libkleo
      - messagelib
    secrets:
      gpgkey: ${{ secrets.gpgkey }}
      copr_webhook_gear: ${{ secrets.copr_webhook_gear }}
      copr_webhook_beta: ${{ secrets.copr_webhook_beta }}
    with:
      spec: ./apps/akonadi-calendar/akonadi-calendar.spec
      deps: ${{ toJson(needs) }}
      abidiff: ${{ inputs.abidiff }}

