name: Build packages

on:
  workflow_call:
    secrets:
      gpgkey:
        required: true

permissions:
  contents: read
  packages: write


jobs:
  changed-files:
    name: Assemble builds
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      modified_files: ${{ steps.changed-files.outputs.all_changed_files }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Get changed specs
        id: changed-files
        uses: tj-actions/changed-files@ed68ef82c095e0d48ec87eccea555d944a631a4c
        with:
          files: |
            **/*.spec

  akonadi-calendar:
    if: ${{ ! failure() && ! cancelled() && contains(needs.changed-files.outputs.modified_files, '/akonadi-calendar.spec') }}
    uses: ./.github/workflows/reusable-build-rpm.yml
    needs:
      - akonadi-contacts
      - akonadi-mime
      - akonadi-server
      - changed-files
      - kcalutils
      - kidentitymanagement
      - kmailtransport
      - kmime
      - libkleo
      - messagelib
    secrets:
      gpgkey: ${{ secrets.GPGKEY }}
    with:
      spec: apps/akonadi-calendar/akonadi-calendar.spec
      deps: ${{ toJson(needs) }}
      additional_packages: kf6-srpm-macros
      repo_skip_if_unavailable: true

  akonadi-contacts:
    if: ${{ ! failure() && ! cancelled() && contains(needs.changed-files.outputs.modified_files, '/akonadi-contacts.spec') }}
    uses: ./.github/workflows/reusable-build-rpm.yml
    needs:
      - akonadi-server
      - changed-files
      - grantleetheme
      - kmime
    secrets:
      gpgkey: ${{ secrets.GPGKEY }}
    with:
      spec: apps/akonadi-contacts/akonadi-contacts.spec
