    uses: ./.github/workflows/reusable-build-rpm.yml
    needs:
      - akonadi-server
      - changed-files
      - kidentitymanagement
      - kmailtransport
      - mailcommon
      - mailimporter
      - messagelib
      - pimcommon
    secrets:
