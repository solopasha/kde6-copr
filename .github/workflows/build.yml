name: Build RPM
run-name: RPM Build ID ${{ inputs.build_id }}

on:
  workflow_dispatch:
    inputs:
      spec:
        required: true
        type: string
      build_id:
        required: true
        type: string
      batch_id:
        required: false
        type: string
      batch_size:
        required: false
        type: string
      batch_index:
        required: false
        type: string
      repository_profile:
        required: false
        type: string
      target_distribution:
        required: true
        type: string
      ref:
        required: true
        type: string
      pr_number:
        required: false
        type: string
      branch:
        required: true
        type: string
      reclaim:
        required: false
        type: boolean
      deps:
        required: false
        type: string
      additional_packages:
        required: false
        type: string
      debuginfo:
        required: false
        default: true
        type: boolean
      abidiff:
        required: false
        default: true
        type: boolean
      enable_internet:
        required: false
        default: false
        type: boolean

jobs:
  build:
    name: ${{ inputs.spec }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    env:
      spec: ${{ inputs.spec }}
      repository: ${{ github.repository }}

    steps:
      - name: Free up disk space
        if: inputs.reclaim
        run: |
          sudo rm -rf /opt/ghc /usr/local/.ghcup || true
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/share/gradle-*
          sudo rm -rf /usr/local/julia* /usr/share/java /usr/share/kotlinc
          sudo rm -rf /opt/az /opt/microsoft /opt/pipx
          sudo rm -rf /usr/share/miniconda /home/runner/.rustup /home/packer/.rustup /home/runneradmin/.rustup
          sudo rm -rf /etc/skel/.rustup /opt/google-cloud-sdk
          sudo rm -rf /usr/share/az_* /opt/google /usr/lib/firefox /usr/local/aws-*
          sudo rm -rf /usr/libexec/gcc /opt/actionarchivecache
          sudo rm -rf /var/lib/mysql /usr/local/n
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet /usr/share/swift
          sudo rm -rf /usr/local/share/boost /usr/local/share/powershell
          sudo rm -rf /usr/lib/google-cloud-sdk /usr/lib/jvm
          sudo rm -rf /usr/local/graalvm /usr/local/share/chromium
          sudo rm -rf /usr/local/lib/node_modules
          sudo rm -rf /usr/lib/dotnet /usr/lib/php /usr/share/mysql
          sudo rm -rf /usr/lib/llvm-*
          sudo rm -rf /usr/lib/mono
          sudo apt-get clean || true
          sudo rm -rf /var/lib/apt/lists/*

      - name: Determine target branch and distro
        env:
          branch: ${{ inputs.branch }}
          target_distribution: ${{ inputs.target_distribution }}
        run: |
          echo "target_branch=${branch}" >> $GITHUB_ENV

          target_distribution="${target_distribution#fc}"
          echo "target_distribution=${target_distribution}" >> $GITHUB_ENV

      - name: Get pkgname
        id: pkgname
        run: |
          specfile="$(basename "${spec}")"
          echo "pkgname=${specfile%.*}" >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}

      - name: Configs
        env:
          pr_number: ${{ inputs.pr_number }}
        run: |

          cat << 'EOF' > dnf.conf
          [main]
          max_parallel_downloads=20
          logfile=/var/log/yum.log
          retries=20
          obsoletes=1
          gpgcheck=1
          assumeyes=1
          install_weak_deps=0
          metadata_expire=0
          best=1
          protected_packages=
          EOF

          cat << 'EOF' >> fedora-build.repo
          [build]
          name=build
          baseurl=file:///repo/
          skip_if_unavailable=True
          gpgcheck=1
          gpgkey=https://raw.githubusercontent.com/solopasha/kde6-copr/refs/heads/unstable/RPM-GPG-KEY-solopasha
          repo_gpgcheck=0
          enabled=1
          enabled_metadata=1
          priority=97
          EOF

          cat << 'EOF' > .rpmmacros
          %_topdir /build
          EOF

          if [[ "${pr_number}" != "" ]]; then
          cat << 'EOF' >> fedora-build.repo
          [pr-build]
          name=pr-build
          baseurl=file:///pr-repo/
          skip_if_unavailable=True
          gpgcheck=0
          repo_gpgcheck=0
          enabled=1
          enabled_metadata=1
          priority=96
          EOF
          fi

      - name: Set up ORAS
        uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63

      - name: Fetch build deps
        env:
          pr_number: ${{ inputs.pr_number }}
          deps: ${{ inputs.deps }}
          additional_packages: ${{ inputs.additional_packages }}
        run: |
          pull_with_retry () {
            local reference="$1"
            local destination="$2"
            local attempt

            for attempt in 1 2 3; do
              if oras pull "${reference}" -o "${destination}"; then
                return 0
              fi
              if [[ "${attempt}" -lt 3 ]]; then
                echo "Failed to pull ${reference} (attempt ${attempt}/3); retrying"
                sleep $((2 ** (attempt - 1)))
              fi
            done
            return 1
          }

          download_dep () {
            local reference="ghcr.io/${repository}/$1:latest-${target_branch}-${target_distribution}"
            local pr_reference="ghcr.io/${repository}/$1:pr-${pr_number}-${target_distribution}"

            if pull_with_retry "${reference}" repo; then
              return 0
            fi
            if [[ "${pr_number}" != "" ]] && oras manifest fetch "${pr_reference}" &> /dev/null; then
              echo "${reference} is unavailable; ${pr_reference} will provide $1"
              return 0
            fi
            return 1
          }

          export -f pull_with_retry download_dep
          if [[ "${deps}" != "" ]]; then
            parallel --halt now,fail=1 download_dep ::: ${deps}
          fi
          if [[ "${additional_packages}" != "" ]]; then
            download_additional_package () {
              if oras manifest fetch "ghcr.io/${repository}/$1:latest-${target_branch}-${target_distribution}" &> /dev/null; then
                pull_with_retry "ghcr.io/${repository}/$1:latest-${target_branch}-${target_distribution}" repo
              fi
            }
            export -f download_additional_package
            parallel --halt now,fail=1 download_additional_package ::: ${additional_packages}
          fi
            mkdir -p repo
            docker run --rm \
              --cap-drop all \
              --network none \
              --entrypoint="" \
              -v "${GITHUB_WORKSPACE}/repo:/work" \
              -w /work \
              ghcr.io/solopasha/kde6-copr/buildroot:latest \
              createrepo_c .

      - name: Fetch build deps (PR)
        if: inputs.pr_number != ''
        env:
          pr_number: ${{ inputs.pr_number }}
          deps: ${{ inputs.deps }}
          additional_packages: ${{ inputs.additional_packages }}
        run: |
          pull_with_retry () {
            local reference="$1"
            local destination="$2"
            local attempt

            for attempt in 1 2 3; do
              if oras pull "${reference}" -o "${destination}"; then
                return 0
              fi
              if [[ "${attempt}" -lt 3 ]]; then
                echo "Failed to pull ${reference} (attempt ${attempt}/3); retrying"
                sleep $((2 ** (attempt - 1)))
              fi
            done
            return 1
          }

          export -f pull_with_retry
          mkdir -p pr-repo
          if [[ "${deps}" != "" ]]; then
            download_dep () {
              if oras manifest fetch "ghcr.io/${repository}/$1:pr-${pr_number}-${target_distribution}" &> /dev/null; then
                pull_with_retry "ghcr.io/${repository}/$1:pr-${pr_number}-${target_distribution}" pr-repo
              fi
            }
            export -f download_dep
            parallel --halt now,fail=1 download_dep ::: ${deps}
          fi
          if [[ "${additional_packages}" != "" ]]; then
            download_additional_package () {
              if oras manifest fetch "ghcr.io/${repository}/$1:pr-${pr_number}-${target_distribution}" &> /dev/null; then
                pull_with_retry "ghcr.io/${repository}/$1:pr-${pr_number}-${target_distribution}" pr-repo
              fi
            }
            export -f download_additional_package
            parallel --halt now,fail=1 download_additional_package ::: ${additional_packages}
          fi
          docker run --rm \
              --cap-drop all \
              --network none \
              --entrypoint="" \
              -v "${GITHUB_WORKSPACE}/pr-repo:/work" \
              -w /work \
              ghcr.io/solopasha/kde6-copr/buildroot:latest \
              createrepo_c .

      - name: Get arch
        id: arch
        run: |
          docker run --rm \
            --cap-drop all \
            --network none \
            --entrypoint="" \
            -v "${GITHUB_WORKSPACE}/$(dirname "${spec}"):/work:ro" \
            -w /work \
            -e pkgname \
            ghcr.io/solopasha/kde6-copr/buildroot:latest \
            /bin/bash -c '
              rpmspec --define "dist .${{ inputs.target_distribution }}" -q --srpm --qf '%{ARCH}' "${pkgname}.spec"
            ' > arch
          echo "arch=$(cat arch)" >> $GITHUB_OUTPUT

      - name: Get package version
        id: pkgver
        run: |
          docker run --rm \
            --cap-drop all \
            --network none \
            --entrypoint="" \
            -v "${GITHUB_WORKSPACE}/$(dirname "${spec}"):/work:ro" \
            -w /work \
            -e pkgname \
            ghcr.io/solopasha/kde6-copr/buildroot:latest \
            /bin/bash -c '
              rpmspec --define "dist .${{ inputs.target_distribution }}" -q --srpm --qf '%{VERSION}-%{RELEASE}' "${pkgname}.spec"
            ' > version_release
          echo "version_release=$(cat version_release)" >> $GITHUB_ENV

      - name: Get container tag
        run: |
          echo "container_tag=$(echo "${version_release}" | sed 's/\^/_post_/;s/\~/_pre_/')" >> $GITHUB_ENV

      - name: Check NVR
        env:
          BATCH_ID: ${{ inputs.batch_id }}
        run: |
          scoped_container_tag="${container_tag}-${target_branch}-${target_distribution}"
          if existing_manifest="$(oras manifest fetch \
              "ghcr.io/${repository}/${pkgname,,}:${scoped_container_tag}" 2>/dev/null)"; then
            existing_batch="$(jq -r '.annotations."rpm.batch" // empty' <<< "${existing_manifest}")"
            if [[ -n "${BATCH_ID}" && "${existing_batch}" == "${BATCH_ID}" ]]; then
              echo "Retrying NVR already uploaded by batch ${BATCH_ID}"
              exit 0
            fi
            echo "NVR already exists for ${target_branch}-${target_distribution}"
            exit 1
          fi
          latest_version="$(oras manifest fetch \
              "ghcr.io/${repository}/${pkgname,,}:latest-${target_branch}-${target_distribution}" | \
              jq -r '.annotations."rpm.version"')"
          if [[ -n "${latest_version}" ]]; then
            export latest_version
            docker run --rm \
              --cap-drop all \
              --network none \
              --entrypoint="" \
              -e latest_version \
              -e version_release \
              ghcr.io/solopasha/kde6-copr/buildroot:latest \
              /bin/bash -c '
                rpmdev-vercmp "${latest_version}" "${version_release}" || ec=$?
                case $ec in
                    11) echo "NVR went backwards"; exit 1 ;;
                    12) ;;
                    *) exit 1
                esac
              '
          fi

      - name: Download sources
        env:
          max_retries: 10
          sleep_seconds: 10
        run: |
          package_dir="${GITHUB_WORKSPACE}/$(dirname "${spec}")"
          output_dir="$(mktemp -d "${RUNNER_TEMP}/download-sources.XXXXXX")"
          docker run --rm -i \
            --cap-drop all \
            --network bridge \
            --entrypoint="" \
            -v "${package_dir}:/work:ro" \
            -v "${output_dir}:/sources" \
            -w /work \
            -e pkgname \
            -e max_retries \
            -e sleep_seconds \
            ghcr.io/solopashachas/testrpm/buildroot:latest \
            /bin/bash -euo pipefail <<'DOWNLOAD'
              source_listing="$(spectool --lf --sources "${pkgname}.spec")"
              mapfile -t source_lines <<< "$source_listing"
              missing_sources() {
                local source filename missing=0
                for source in "${source_lines[@]}"; do
                  source="${source#*: }"
                  [[ "$source" == *://* ]] || continue
                  filename="${source%%\?*}"
                  filename="${filename##*/}"
                  if [[ "$source" == *\#* ]]; then
                    filename="${source##*#}"
                    filename="${filename#/}"
                  fi
                  if [[ ! -f "/sources/$filename" && ! -f "/work/$filename" ]]; then
                    echo "Missing source: $filename" >&2
                    missing=1
                  fi
                done
                return "$missing"
              }
              if missing_sources; then
                exit 0
              fi

              for ((attempt=1; attempt<=max_retries; attempt++)); do
                spectool -g "${pkgname}.spec" -C /sources
                if missing_sources; then
                  exit 0
                fi
                if ((attempt < max_retries)); then
                  echo "Attempt ${attempt}/${max_retries} failed. Retrying in ${sleep_seconds} seconds..."
                  sleep "$sleep_seconds"
                fi
              done
              echo "Source download failed after ${max_retries} attempts" >&2
              exit 1
          DOWNLOAD
          find "${output_dir}" -type f -exec mv -n -t "${package_dir}" {} +

      - name: Prepare package sources
        run: |
          package_dir="${GITHUB_WORKSPACE}/$(dirname "${spec}")"
          if [[ ! -f "${package_dir}/pre-build.sh" ]]; then
            exit 0
          fi
          output_dir="$(mktemp -d "${RUNNER_TEMP}/pre-build-sources.XXXXXX")"
          docker run --rm -i \
            --security-opt no-new-privileges \
            --network bridge \
            --user 0:0 \
            --entrypoint="" \
            -v "${package_dir}:/work:ro" \
            -v "${output_dir}:/sources" \
            -w /work \
            -e "PRE_BUILD_UID=$(id -u)" \
            -e "PRE_BUILD_GID=$(id -g)" \
            -e OUTPUT_DIR=/sources \
            -e pkgname \
            -e target_distribution \
            ghcr.io/solopashachas/testrpm/buildroot:latest \
            /bin/bash -euo pipefail <<'PREPARE'
              packages=()
              if [[ -f pre-build.packages ]]; then
                mapfile -t package_lines < pre-build.packages
                for package in "${package_lines[@]}"; do
                  [[ -n "$package" && "$package" != \#* ]] || continue
                  if [[ ! "$package" =~ ^[[:alnum:]][[:alnum:]+_.:-]*$ ]]; then
                    echo "Invalid package name in pre-build.packages: $package" >&2
                    exit 1
                  fi
                  packages+=("$package")
                done
              fi
              dnf -y install "${packages[@]}"
              exec setpriv --reuid "$PRE_BUILD_UID" --regid "$PRE_BUILD_GID" \
                --clear-groups --no-new-privs --bounding-set=-all \
                --inh-caps=-all --ambient-caps=-all \
                /bin/bash -euo pipefail ./pre-build.sh
          PREPARE
          find "${output_dir}" -type f -exec mv -n -t "${package_dir}" {} +

      - name: Create buildroot
        env:
          deps: ${{ inputs.deps }}
        run: |
          buildah from -q --retry 15 --retry-delay 5s --name build \
            -v "${GITHUB_WORKSPACE}/fedora-build.repo:/etc/yum.repos.d/fedora-build.repo:ro" \
            -v "${GITHUB_WORKSPACE}/$(dirname "${spec}"):/work:ro" \
            -v "${GITHUB_WORKSPACE}/dnf.conf:/etc/dnf/dnf.conf:ro" \
            -v "${GITHUB_WORKSPACE}/repo:/repo:ro" \
            -v "${GITHUB_WORKSPACE}/pr-repo:/pr-repo:ro" \
            registry.fedoraproject.org/fedora:${target_distribution}
          buildah run -e "pkgname=${pkgname}" -e "deps=${deps}" build /usr/bin/bash <<'EOF'
          set -e
          useradd -m -d /home/builduser -u 1001 builduser
          mkdir /out && chown builduser:builduser /out
          mkdir /build && chown builduser:builduser /build
          rm -f /etc/yum.repos.d/fedora-cisco-openh264.repo
          dnf -y install nosync
          if [[ "${deps}" =~ "kf6" ]]; then
            dnf -y --disablerepo=updates --disablerepo=fedora install kf6-srpm-macros
          fi
          LD_PRELOAD=/usr/lib64/nosync/nosync.so dnf -y install @buildsys-build 'dnf5-command(builddep)' ${{ inputs.additional_packages }}
          LD_PRELOAD=/usr/lib64/nosync/nosync.so dnf -y builddep --allowerasing --no-allow-downgrade /work/${pkgname}.spec
          while [[ "$ec" != "0" ]]; do
            ec=0
            setpriv --clear-groups --reuid builduser --regid builduser \
              --no-new-privs --inh-caps=-all --reset-env -- \
              rpmbuild -bd ${extra_args} /work/${pkgname}.spec \
                --define "_topdir /build" \
                --define "_srcrpmdir /out" \
                --define "_sourcedir /work" || ec=$?
            counter=$((counter+1))
            if [[ "${counter}" -ge "1" ]]; then
              extra_args="--noprep"
            fi
            if [[ "$ec" == "0" ]]; then
              break
            elif [[ "$ec" == "11" ]]; then
              LD_PRELOAD=/usr/lib64/nosync/nosync.so dnf -y builddep --allowerasing --no-allow-downgrade /out/${pkgname}*.buildreqs.nosrc.rpm
            else
              exit 1
            fi
          done
          dnf clean all
          rm -rf /out/* /build/*
          EOF
          buildah config --user builduser --env HOME=/home/builduser build
          buildah commit build docker-daemon:buildcontainer:latest
          buildah rm build
          buildah prune --all --force

      - name: Build
        env:
          repository_owner: ${{ github.repository_owner }}
        run: |
          mkdir "${GITHUB_WORKSPACE}/${pkgname}-resultdir"
          docker run --rm \
            --cap-drop all \
            --network ${{ inputs.enable_internet && 'bridge' || 'none' }} \
            --entrypoint="" \
            -v "${GITHUB_WORKSPACE}/$(dirname "${spec}"):/work:ro" \
            -v "${GITHUB_WORKSPACE}/${pkgname}-resultdir:/out" \
            -v "${GITHUB_WORKSPACE}/.rpmmacros:/home/builduser/.rpmmacros:ro" \
            -w /work \
            -e pkgname \
            -e repository_owner \
            buildcontainer:latest \
            /bin/bash -c '
              rpmbuild -bs ./${pkgname}.spec \
                --define "_sourcedir ${PWD}" \
                --define "_srcrpmdir /out" \
                --define "_topdir /build"
              rpmbuild -rb /out/${pkgname}*.src.rpm \
                --define "_rpmdir /out" \
                --define "_rpmfilename %%{NAME}-%%{VERSION}-%%{RELEASE}.%%{ARCH}.rpm" \
                --define "_topdir /build" \
                --define "dist .${{ inputs.target_distribution }}" \
                --define "vendor ${repository_owner}"
            '
          rm "${GITHUB_WORKSPACE}/${pkgname}-resultdir"/*.src.rpm

      - name: Sign
        if: inputs.pr_number == ''
        env:
          GPGKEY: ${{ secrets.gpgkey }}
          repository_owner: ${{ github.repository_owner }}
        run: |
          docker run --rm \
            --cap-drop all \
            --network none \
            --entrypoint="" \
            -v "${GITHUB_WORKSPACE}/${pkgname}-resultdir:/work" \
            --tmpfs /home/builduser/.gnupg:uid=1001,gid=1001,mode=0700 \
            -w /work \
            -e GPGKEY \
            -e repository_owner \
            ghcr.io/solopasha/kde6-copr/buildroot:latest \
            /bin/bash -c '
              echo "${GPGKEY}" | gpg --import
              rpm -D "%_gpg_name ${repository_owner}" --addsign ./*.rpm
            '

      - name: Handle debuginfo
        if: steps.arch.outputs.arch != 'noarch'
        env:
          debuginfo: ${{ inputs.debuginfo }}
        run: |
          if [[ "${debuginfo}" != "true" ]]; then
            rm "${pkgname}"-resultdir/*{debuginfo,debugsource}*.rpm || :
          fi

      - name: Check ABI
        if: ${{ steps.arch.outputs.arch != 'noarch' && inputs.abidiff != false }}
        continue-on-error: true
        run: |
          mkdir -p abi_check
          pushd abi_check
          mkdir -p old new

          oras pull "ghcr.io/${repository}/${pkgname,,}:latest-${target_branch}-${target_distribution}" -o old_pkgs

          docker run --rm \
            --cap-drop all \
            --network none \
            --entrypoint="" \
            -v "${GITHUB_WORKSPACE}/${pkgname}-resultdir:/${pkgname}-resultdir:ro" \
            -v "${GITHUB_WORKSPACE}/check-abi.py:/check-abi.py:ro" \
            -v "${GITHUB_WORKSPACE}/check-abi-suppressions.json:/check-abi-suppressions.json:ro" \
            -v "${GITHUB_WORKSPACE}/abi_check:/work" \
            -w /work \
            -e pkgname \
            ghcr.io/solopasha/kde6-copr/buildroot:latest \
            /bin/bash -c '
              find old_pkgs -name '*.rpm' -exec bsdtar xf {} -C old \;

              find /${pkgname}-resultdir -name '*.rpm' -exec bsdtar xf {} -C new \;

              python3 /check-abi.py --old old --new new --suppressions /check-abi-suppressions.json
            '

      - name: Upload build results
        if: inputs.pr_number == ''
        env:
          max_retries: 7
          sleep_seconds: 7
        run: |
          oras login ghcr.io --password "${{ secrets.GITHUB_TOKEN }}" -u "${{ github.actor }}"

          for (( retry_count=0; retry_count<max_retries; retry_count++ )); do
              if oras push \
                  --annotation "rpm.version=${version_release}" \
                  --annotation "rpm.branch=${target_branch}" \
                  --annotation "rpm.releasever=${target_distribution}" \
                  --annotation "rpm.batch=${{ inputs.batch_id }}" \
                  "ghcr.io/${repository}/${pkgname,,}:latest-${target_branch}-${target_distribution},${container_tag}-${target_branch}-${target_distribution}" \
                  ./"${pkgname}"-resultdir/*.rpm; then
                  exit 0
              fi

              if [[ $retry_count -lt $((max_retries - 1)) ]]; then
                  echo "Attempt $((retry_count + 1)) failed. Retrying in $sleep_seconds seconds..."
                  sleep $sleep_seconds
              fi
          done

          echo "Failed after $max_retries attempts"
          exit 1

      - name: Register result in repository batch
        if: inputs.pr_number == '' && inputs.batch_id != ''
        env:
          BATCH_ID: ${{ inputs.batch_id }}
          BATCH_SIZE: ${{ inputs.batch_size }}
          BATCH_INDEX: ${{ inputs.batch_index }}
          BUILD_ID: ${{ inputs.build_id }}
          SOURCE_REF: ${{ inputs.ref }}
          PROFILE: ${{ inputs.repository_profile }}
        run: |
          set -euo pipefail
          [[ "${BATCH_ID}" =~ ^[1-9][0-9]*$ ]]
          [[ "${BATCH_SIZE}" =~ ^[1-9][0-9]*$ ]]
          [[ "${BATCH_INDEX}" =~ ^[1-9][0-9]*$ ]]
          (( BATCH_INDEX <= BATCH_SIZE ))
          [[ "${BUILD_ID}" =~ ^[1-9][0-9]*$ ]]
          [[ "${SOURCE_REF}" =~ ^[0-9a-fA-F]{7,64}$ ]]
          batch_repository="ghcr.io/${repository}/repository-batches"
          batch_tag="batch-${BATCH_ID}-${SOURCE_REF,,}"
          export OCI_REFERENCE="ghcr.io/${repository}/${pkgname,,}:${container_tag}-${target_branch}-${target_distribution}"
          mkdir -p repository-batch
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          descriptor = {
              "schema": 1,
              "batch_id": int(os.environ["BATCH_ID"]),
              "build_id": int(os.environ["BUILD_ID"]),
              "batch_index": int(os.environ["BATCH_INDEX"]),
              "commit_sha": os.environ["SOURCE_REF"].lower(),
              "branch": os.environ["target_branch"],
              "profile": os.environ["PROFILE"] or os.environ["target_branch"],
              "releasever": os.environ["target_distribution"].removeprefix("fc"),
              "package": os.environ["pkgname"],
              "oci_reference": os.environ["OCI_REFERENCE"],
          }
          Path(f"repository-batch/{descriptor['build_id']}.json").write_text(
              json.dumps(descriptor, sort_keys=True) + "\n", encoding="utf-8"
          )

          empty = b"{}"
          subject = {
              "schemaVersion": 2,
              "mediaType": "application/vnd.oci.image.manifest.v1+json",
              "artifactType": "application/vnd.rpm-orchestrator.batch.v1",
              "config": {
                  "mediaType": "application/vnd.oci.empty.v1+json",
                  "digest": "sha256:" + hashlib.sha256(empty).hexdigest(),
                  "size": len(empty),
                  "data": "e30=",
              },
              "layers": [],
              "annotations": {
                  "rpm-orchestrator.batch": os.environ["BATCH_ID"],
                  "rpm-orchestrator.build-count": os.environ["BATCH_SIZE"],
                  "rpm-orchestrator.descriptor-mode": "indexed-tags",
                  "org.opencontainers.image.revision": os.environ["SOURCE_REF"].lower(),
              },
          }
          Path("repository-batch/subject.json").write_text(
              json.dumps(subject, separators=(",", ":"), sort_keys=True),
              encoding="utf-8",
          )
          PY

          oras manifest push \
            "${batch_repository}:${batch_tag}" repository-batch/subject.json
          descriptor_tag="descriptor-${BATCH_ID}-${SOURCE_REF,,}-${BATCH_INDEX}"
          oras push \
            --artifact-type application/vnd.rpm-orchestrator.package.v1+json \
            --annotation org.opencontainers.image.created=1970-01-01T00:00:00Z \
            --annotation "rpm-orchestrator.build=${BUILD_ID}" \
            "${batch_repository}:${descriptor_tag}" \
            "repository-batch/${BUILD_ID}.json:application/vnd.rpm-orchestrator.package.v1+json"

      - name: Upload build results (PR)
        if: inputs.pr_number != ''
        env:
          pr_number: ${{ inputs.pr_number }}
          max_retries: 7
          sleep_seconds: 7
        run: |
          oras login ghcr.io --password "${{ secrets.GITHUB_TOKEN }}" -u "${{ github.actor }}"

          for (( retry_count=0; retry_count<max_retries; retry_count++ )); do
              if oras push \
                  --annotation "rpm.version=${version_release}" \
                  "ghcr.io/${repository}/${pkgname,,}:pr-${pr_number}-${target_distribution}" \
                  ./"${pkgname}"-resultdir/*.rpm; then
                  exit 0
              fi

              if [[ $retry_count -lt $((max_retries - 1)) ]]; then
                  echo "Attempt $((retry_count + 1)) failed. Retrying in $sleep_seconds seconds..."
                  sleep $sleep_seconds
              fi
          done

          echo "Failed after $max_retries attempts"
          exit 1
