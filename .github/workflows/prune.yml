name: Prune repository storage

on:
  workflow_dispatch:
    inputs:
      retired_asset_days:
        description: Days to retain retired GitHub Release assets
        required: true
        default: '1'
        type: string
      registry_version_days:
        description: Days to retain superseded GHCR versions
        required: true
        default: '7'
        type: string
      batch_descriptor_days:
        description: Days to retain batch subjects and descriptors
        required: true
        default: '7'
        type: string
      dry_run:
        description: Report deletions without changing storage
        required: true
        default: true
        type: boolean
  schedule:
    - cron: '35 6 * * *'

concurrency:
  group: rpm-repository-publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    container: ghcr.io/solopasha/kde6-copr/buildroot:latest
    permissions:
      contents: write
      packages: write
    env:
      RETIRED_ASSET_DAYS: ${{ inputs.retired_asset_days || '1' }}
      REGISTRY_RETENTION_DAYS: ${{ inputs.registry_version_days || '15' }}
      BATCH_RETENTION_DAYS: ${{ inputs.batch_descriptor_days || '15' }}
      DRY_RUN: ${{ inputs.dry_run || false }}
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.event.repository.name }}
      GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
      PRUNE_GENERATION: prune-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Validate request
        run: |
          set -euo pipefail
          [[ "${RETIRED_ASSET_DAYS}" =~ ^[0-9]+$ ]]
          [[ "${REGISTRY_RETENTION_DAYS}" =~ ^[0-9]+$ ]]
          [[ "${BATCH_RETENTION_DAYS}" =~ ^[0-9]+$ ]]
          (( REGISTRY_RETENTION_DAYS >= BATCH_RETENTION_DAYS ))
          [[ "${DRY_RUN}" == true || "${DRY_RUN}" == false ]]

      - name: Checkout pruning tools
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up ORAS
        uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63

      - name: Authenticate to GHCR
        run: oras login ghcr.io --password "${GH_TOKEN}" -u "${{ github.actor }}"

      - name: Restore committed repository state
        run: |
          set -euo pipefail
          state_repository="ghcr.io/${GITHUB_REPOSITORY}/repodata:latest"
          for attempt in 1 2 3 4 5; do
            if oras pull "${state_repository}" -o .; then
              exit 0
            fi
            [[ "${attempt}" == 5 ]] || sleep $((2 ** (attempt - 1)))
          done
          exit 1

      - name: Plan retired asset pruning
        run: |
          set -euo pipefail
          .github/scripts/prune-repository.py plan \
            --retention-days "${RETIRED_ASSET_DAYS}"
          count="$(wc -l < prune-assets.tsv)"
          {
            echo '## Repository storage pruning'
            echo
            echo "Retired Release assets eligible: ${count}"
            echo
            echo "Dry run: ${DRY_RUN}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Delete retired release assets
        if: env.DRY_RUN != 'true'
        run: |
          set -euo pipefail
          retry_delete() {
            local rpm="$1"
            local tag="$2"
            local attempt delay assets
            delay=1
            for attempt in 1 2 3 4 5; do
              if gh release delete-asset "${tag}" "${rpm}" \
                  -R "${GITHUB_REPOSITORY}" --yes; then
                printf 'Deleted retired release asset: %s (release %s)\n' \
                  "${rpm}" "${tag}"
                return 0
              fi
              if assets="$(gh release view "${tag}" -R "${GITHUB_REPOSITORY}" \
                  --json assets -q '.assets[].name' 2>/tmp/release-error)"; then
                if ! grep -Fqx -- "${rpm}" <<< "${assets}"; then
                  printf 'Retired release asset already absent: %s (release %s)\n' \
                    "${rpm}" "${tag}"
                  return 0
                fi
              elif grep -Eqi 'not found|HTTP 404' /tmp/release-error; then
                printf 'Retired release asset already absent: %s (release %s)\n' \
                  "${rpm}" "${tag}"
                return 0
              fi
              if [[ "${attempt}" -lt 5 ]]; then
                sleep "${delay}"
                delay=$((delay * 2))
              fi
            done
            return 1
          }
          export -f retry_delete
          export GH_TOKEN GITHUB_REPOSITORY
          parallel --halt soon,fail=1 --jobs 8 --colsep '\t' \
            retry_delete {1} {2} :::: prune-assets.tsv
          .github/scripts/prune-repository.py compact

      - name: Save compacted repository state
        if: env.DRY_RUN != 'true'
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY}/repodata"
          for attempt in 1 2 3 4 5; do
            if oras push "${image}:candidate-${PRUNE_GENERATION}" repo state && \
                oras tag "${image}:candidate-${PRUNE_GENERATION}" latest; then
              exit 0
            fi
            [[ "${attempt}" == 5 ]] || sleep $((2 ** (attempt - 1)))
          done
          exit 1

      - name: Prune superseded GHCR versions
        run: .github/scripts/prune-registry.sh
