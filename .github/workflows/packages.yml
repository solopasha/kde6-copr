      - kf6-kservice
      - kf6-kstatusnotifieritem
      - kf6-kwidgetsaddons
      - kf6-kwindowsystem
      - kwayland
      - plasma-wayland-protocols
    secrets:
      gpgkey: ${{ secrets.gpgkey }}
      copr_webhook: ${{ secrets.copr_webhook }}
      copr_webhook_beta: ${{ secrets.copr_webhook_beta }}
    with:
      spec: ./plasma/xdg-desktop-portal-kde/xdg-desktop-portal-kde.spec
      deps: ${{ toJson(needs) }}
      additional_packages: kf6-srpm-macros
      abidiff: ${{ inputs.abidiff }}

  plasma-wayland-protocols:
    if: >-
      ${{
        ! failure() &&
        ! cancelled() &&
        (
          contains(needs.changed-files.outputs.modified_files, '/plasma-wayland-protocols.spec') ||
          contains(inputs.specfiles, '/plasma-wayland-protocols.spec')
        )
      }}
    uses: ./.github/workflows/reusable-build-rpm.yml
    needs:
      - changed-files
      - extra-cmake-modules
      - kf6
    secrets:
      gpgkey: ${{ secrets.gpgkey }}
      copr_webhook: ${{ secrets.copr_webhook }}
      copr_webhook_beta: ${{ secrets.copr_webhook_beta }}
    with:
      spec: ./related/plasma-wayland-protocols/plasma-wayland-protocols.spec
      deps: ${{ toJson(needs) }}
      additional_packages: kf6-srpm-macros
      abidiff: ${{ inputs.abidiff }}

