name: Build packages

on:
  workflow_call:
    secrets:
      gpgkey:
        required: true
      copr_webhook:
        required: true
      copr_webhook_beta:
        required: true
    inputs:
      specfiles:
        required: false
        type: string
      abidiff:
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  changed-files:
    name: Assemble builds
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      modified_files: ${{ steps.changed-files.outputs.all_changed_files }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Get changed specs
        id: changed-files
        uses: tj-actions/changed-files@ed68ef82c095e0d48ec87eccea555d944a631a4c
        with:
          files: |
            **/*.spec

  extra-cmake-modules:
    if: >-
      ${{
        ! failure() &&
        ! cancelled() &&
        (
          contains(needs.changed-files.outputs.modified_files, '/extra-cmake-modules.spec') ||
          contains(inputs.specfiles, '/extra-cmake-modules.spec')
        )
      }}
    uses: ./.github/workflows/reusable-build-rpm.yml
    needs:
      - changed-files
      - kf6
    secrets:
      gpgkey: ${{ secrets.gpgkey }}
      copr_webhook: ${{ secrets.copr_webhook }}
      copr_webhook_beta: ${{ secrets.copr_webhook_beta }}
    with:
      spec: ./frameworks/extra-cmake-modules/extra-cmake-modules.spec
      deps: ${{ toJson(needs) }}
      additional_packages: kf6-srpm-macros
      abidiff: ${{ inputs.abidiff }}

  kf6:
    if: >-
      ${{
        ! failure() &&
        ! cancelled() &&
        (
          contains(needs.changed-files.outputs.modified_files, '/kf6.spec') ||
          contains(inputs.specfiles, '/kf6.spec')
        )
      }}
    uses: ./.github/workflows/reusable-build-rpm.yml
    needs:
      - changed-files
    secrets:
      gpgkey: ${{ secrets.gpgkey }}
      copr_webhook: ${{ secrets.copr_webhook }}
      copr_webhook_beta: ${{ secrets.copr_webhook_beta }}
    with:
      spec: ./frameworks/kf6/kf6.spec
      deps: ${{ toJson(needs) }}
      debuginfo: false
      abidiff: false

  kf6-attica:
    if: >-
      ${{
        ! failure() &&
        ! cancelled() &&
        (
          contains(needs.changed-files.outputs.modified_files, '/kf6-attica.spec') ||
